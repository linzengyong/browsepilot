# ⚠️ enabled: false —— schema 已支持多轮（follow_up 字段），但 **harness 还没接线**。
#
# 为什么先停用而不是"跑首轮"：只跑 prompt 首轮、却按"多轮上下文"的口径断言 = 假通过
# （首轮的答案天然含"北京"）。断言的价值在于它真的能证明所声明的东西。
#
# 接线要做两件事（T3/T5）：
# 1) 用 run_task(history=[...]) 跑 follow_up 的每一轮（history = 前几轮的 "Q: … / A: …" 摘要）
# 2) checks 评估**最后一轮**的 outcome（而不是首轮）
#
# 为什么只有"答案含北京"这一条断言（T2 读 graph.py + router.py 的结论）：
# - "那明天呢？" 不含"北京"，所以最终答案里出现"北京" = 历史注入到了 answer 节点（这就是
#   本场景要证明的东西，且它在两条 answer 路径上都成立：工具数据路径 / 直答路径都会带 history）。
# - **不**断言 tools_called：classify 与 execute 的参数提取都只看 task 原文（不看 history），
#   第二轮流到哪个工具/能不能提出城市是不确定的 —— 那是另一个架构缺口（T7 需实测记录），
#   不该写成一条必然抖动的断言。
id: multi_turn_context
name: 多轮上下文（先天气后追问；harness 接线前停用）
prompt: "北京今天天气怎么样？"
follow_up:
  - "那明天呢？"
tier: tier1
tags: [acceptance]
mode: real
enabled: false
checks:
  - type: contains_keyword
    keywords: ["北京"]  # 第二轮 prompt 里没有"北京"：最终答案出现即证明历史注入生效
